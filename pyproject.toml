[project]
name = "policyqa"
version = "0.1.0"
description = "Local RAG system over policy documents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "pypdf>=5.1",
    "langchain>=0.3",
    "langchain-ollama>=0.3",
    "langchain-postgres>=0.0.14",
    "langchain-text-splitters>=0.3",
    "rich>=13.9",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.63.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]
